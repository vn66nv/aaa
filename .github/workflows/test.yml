name: Kunsabai smoke test
on:
  push:
    paths: ["kunsabai/**", "tests/**", ".github/workflows/test.yml"]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: node tests/smoke.js
      - run: node tests/live-mock.js
      - run: node tests/offline.js
  schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env: { PGHOST: localhost, PGPORT: "5432", PGUSER: postgres, PGPASSWORD: postgres }
    steps:
      - uses: actions/checkout@v4
      - run: tests/schema.sh | tee out.txt && grep -q "Все проверки схемы прошли" out.txt && ! grep -q "✘" out.txt
